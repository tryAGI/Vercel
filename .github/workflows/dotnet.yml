name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    uses: tryAGI/workflows/.github/workflows/generated-sdk-publish.yml@main
    with:
      auto-stable-release: true
      project-path: src/libs/Vercel/Vercel.csproj
      dotnet-version: 10.0.x
      enable-caching: false
      additional-test-arguments: '--logger GitHubActions'
    secrets:
      nuget-key: ${{ secrets.NUGET_KEY }}

  native-aot-smoke:
    name: NativeAOT JSON smoke (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish native JSON contract harness
        run: dotnet publish src/tests/NativeAotSmoke/Vercel.NativeAotSmoke.csproj -c Release -r linux-x64 -o artifacts/native-smoke
      - name: Exercise generated metadata and converters
        run: ./artifacts/native-smoke/Vercel.NativeAotSmoke
