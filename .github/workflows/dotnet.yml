name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    uses: tryAGI/workflows/.github/workflows/generated-sdk-publish.yml@main
    with:
      auto-stable-release: true
      project-path: src/libs/Vercel/Vercel.csproj
      dotnet-version: 10.0.x
      enable-caching: false
      additional-test-arguments: '--logger GitHubActions'

  native-aot-smoke:
    name: NativeAOT JSON smoke (${{ matrix.runtime }}, offline)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtime: linux-x64
          - runner: ubuntu-24.04-arm
            runtime: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish native JSON contract harness
        run: dotnet publish src/tests/NativeAotSmoke/Vercel.NativeAotSmoke.csproj -c Release -r ${{ matrix.runtime }} -o artifacts/native-smoke
      - name: Exercise generated metadata and converters
        run: ./artifacts/native-smoke/Vercel.NativeAotSmoke

  nuget-trusted-publish:
    name: NuGet trusted publishing
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-publish@main
        with:
          user: havendv
